name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Go + Ruby Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_review_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go-gateway/go.mod"
          check-latest: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: ruby-api/.ruby-version
          bundler-cache: true
          working-directory: ruby-api

      - name: Setup Ruby database
        working-directory: ruby-api
        run: |
          bundle exec rails db:create db:schema:load
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/code_review_api_test

      - name: Start Ruby API
        working-directory: ruby-api
        run: |
          bundle exec rails server -p 3000 &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/code_review_api_test
          RAILS_ENV: test
          PORT: 3000

      - name: Wait for Ruby API
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/v1/health; do sleep 2; done'

      - name: Build Go Gateway
        working-directory: go-gateway
        run: go build -o gateway .

      - name: Start Go Gateway
        working-directory: go-gateway
        run: |
          ./gateway &
        env:
          RUBY_API_URL: http://localhost:3000
          REDIS_URL: localhost:6379
          PORT: 8080

      - name: Wait for Go Gateway
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

      - name: Run integration tests
        run: |
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/api/v1/health
          echo "Integration tests passed!"
