name: Go CI

on:
  push:
    paths:
      - "go-gateway/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go-gateway/**"
      - ".github/workflows/go-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go-gateway/go.mod"
          check-latest: true

      - name: Install dependencies
        working-directory: go-gateway
        run: go mod download

      - name: Run tests
        working-directory: go-gateway
        run: go test -coverprofile=coverage.txt -covermode=atomic -v ./...

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./go-gateway/coverage.txt
          flags: go
          name: go-coverage
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go-gateway/go.mod"
          check-latest: true

      - name: Install dependencies
        working-directory: go-gateway
        run: go mod download

      - name: Build
        working-directory: go-gateway
        run: |
          go build -v ./...

      - name: Run govulncheck
        working-directory: go-gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "Vulnerability check completed"
        continue-on-error: true

  style:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go-gateway/go.mod"
          check-latest: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Format code
        working-directory: go-gateway
        run: |
          gofmt -s -w .
          goimports -w .

      - name: Check gofmt
        working-directory: go-gateway
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi

      - name: Check goimports
        working-directory: go-gateway
        run: |
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Imports are not formatted. Run 'goimports -w .'"
            goimports -d .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go-gateway
          args: --timeout=5m --skip-files="gateway_test.go"
          only-new-issues: false
